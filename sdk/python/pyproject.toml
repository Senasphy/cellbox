[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cellbox-sdk"
version = "0.1.0"
description = "Python client for the cellbox sandbox API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/cellbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running cellbox Docker backend"]
